# Netlify — sitio trazapp.netlify.app con "Base directory" = frontend (único netlify.toml del repo).
#
# En Netlify → Site configuration → Environment variables:
#   VITE_API_URL = /api      (ruta relativa: el navegador habla solo con Netlify)
#
# Netlify no lee variables en las reglas: el dominio del VPS va escrito en el rewrite de /api/*.
# Si cambia (otra IP o DuckDNS), cámbialo aquí y en DOMINIO de .env.production (docs/despliegue.md).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 1) La API: /api/<ruta> → https://<dominio del VPS>/<ruta> (el backend no tiene prefijo /api).
#    Status 200 = proxy (reescritura), no redirección: para el navegador es el mismo origen.
[[redirects]]
  from = "/api/*"
  to = "https://189-24-13-100.sslip.io/:splat"
  status = 200
  force = true

# 2) Después, el fallback de la SPA (React Router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
