services:
  database:
    image: postgres:16-alpine
    container_name: trazapp-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trazapp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOADS_ROOT: ${UPLOADS_ROOT:-/uploads}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - product_uploads:/uploads
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload"

  # Solo para desarrollo: Vite con recarga en caliente. En produccion el frontend esta en Netlify.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trazapp-frontend
    restart: unless-stopped
    environment:
      # El navegador del host llama a la API (no el contenedor): localhost y el puerto publicado.
      VITE_API_URL: http://localhost:${API_PORT:-8000}
      # Solo con `npm run dev:https` dentro del contenedor: su proxy llega al backend por la red de Docker.
      VITE_DEV_API_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5175}:5175"
    volumes:
      - ./frontend:/app
      # node_modules propios del contenedor (Linux): no se usan los de Windows (binarios nativos).
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  product_uploads:
