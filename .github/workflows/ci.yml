# Integración continua de TrazApp: prueba el backend (SQLite y PostgreSQL) y el frontend.
name: CI

# Cuándo se ejecuta: al subir cambios a main, en cada Pull Request hacia main
# y a mano desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# El flujo solo necesita leer el código.
permissions:
  contents: read

# Si subes un commit nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Los tres trabajos no dependen entre sí, así que corren en paralelo.
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # la misma que usa backend/Dockerfile
          cache: pip # guarda las dependencias entre ejecuciones
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      # Sin TEST_DATABASE_URL, las pruebas usan SQLite en memoria.
      - name: Ejecutar pruebas
        run: python -m pytest -q --junitxml=resultados.xml

      # always(): se publica el resumen aunque las pruebas hayan fallado.
      - name: Resumen de pruebas
        if: always()
        run: python ../.github/scripts/resumen_pruebas.py "Backend (SQLite)" resultados.xml

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    # Contenedor de PostgreSQL desechable: existe solo durante este trabajo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trazapp_ci
          POSTGRES_PASSWORD: ci_password_desechable # no es una credencial real
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Los pasos esperan a que este chequeo diga que PostgreSQL está listo.
        options: >-
          --health-cmd "pg_isready -U trazapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # La base trazapp_test la crea conftest.py si no existe.
      TEST_DATABASE_URL: postgresql+psycopg2://trazapp_ci:ci_password_desechable@localhost:5432/trazapp_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q --junitxml=resultados.xml

      - name: Resumen de pruebas
        if: always()
        run: python ../.github/scripts/resumen_pruebas.py "Backend (PostgreSQL)" resultados.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # la misma que usa frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala exactamente lo que dice package-lock.json.
      - name: Instalar dependencias
        run: npm ci

      # "vitest run" ejecuta una sola vez (sin modo watch).
      - name: Ejecutar pruebas
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=resultados.xml

      - name: Resumen de pruebas
        if: always()
        run: python3 ../.github/scripts/resumen_pruebas.py "Frontend (Vitest)" resultados.xml

      - name: Compilar
        run: npm run build
